services:
  app:
    build: .
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    working_dir: /app

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    working_dir: /app
    environment:
      - MODEL_PATH=models/best_model.joblib

  bot:
    build: .
    command: python -m app.telegram_bot
    profiles:
      - bot
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    working_dir: /app
    environment:
      - MODEL_PATH=models/best_model.joblib
